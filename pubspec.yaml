name: quillgrade_mobile
description: "QuillGrade - Smart Cinnamon Grading. Independent offline-first mobile application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  drift: ^2.35.4
  sqlite3: ^3.9.1
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.5.2
  camera: ^0.12.2
  permission_handler: ^13.0.2
  image: ^4.13.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.16.2
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/branding/quillgrade_logo.png
